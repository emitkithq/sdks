name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      # npm trusted publishing (OIDC, `id-token: write`) needs npm >= 11.5.1.
      # No registry-url: its generated .npmrc expects a token.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Sync OpenAPI spec
        run: pnpm run sync

      - name: Generate SDKs
        run: pnpm run generate

      - name: Run tests
        run: pnpm run test

      - name: Build packages
        run: pnpm run build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          title: 'chore: release packages'
          commit: 'chore: release packages'
        env:
          # The package publishes through npm trusted publishing, so no npm
          # token. Actions may open PRs (repository setting), so no PAT.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
